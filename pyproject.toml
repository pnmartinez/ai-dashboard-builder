[project]
name = "ai-dashboard-builder"
version = "0.6.0"
description = "Throw your data, let AI make a dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "pnmartinez", email = "pablonavaber@hotmail.com" },
]
dependencies = [
    "anthropic>=0.18.1",
    "dash-bootstrap-components>=1.5.0",
    "dash-dangerously-set-inner-html>=0.0.2",
    "dash[diskcache]>=2.15.0",
    "markdown2>=2.4.12",
    "numpy>=1.26.4",
    "openai>=1.12.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.1",
    "plotly>=5.19.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scipy>=1.11.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "dashboard", "data", "visualization", "plotly", "dash", "openai", "anthropic", "llm"]

[project.urls]
Homepage = "https://github.com/pnmartinez/ai-dashboard-builder/"

[project.scripts]
ai_dashboard_builder = "ai_dashboard_builder.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I", "D"]
extend-ignore = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["src/ai_dashboard_builder/tests"]
python_files = "test_*.py"
addopts = "-v --cov=ai_dashboard_builder"

[tool.coverage.run]
source = ["ai_dashboard_builder"]
omit = ["tests/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
